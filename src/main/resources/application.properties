spring.application.name=backend

# Conexion a la base de datos existente. Las credenciales se leen de variables de entorno.
# Los valores por defecto son solo para desarrollo local; no los uses en produccion.
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:investigacion_ueb}?useUnicode=true&characterEncoding=utf8&connectTimeout=5000&socketTimeout=10000
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:1250833}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

# Thymeleaf / MVC
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.mvc.hiddenmethod.filter.enabled=true
spring.web.resources.cache.period=3600

# Seguridad de sesion y errores
server.servlet.session.timeout=30m
server.error.include-message=never
server.error.include-stacktrace=never

logging.level.com.example.backend=INFO

