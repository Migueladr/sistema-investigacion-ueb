<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuarios y seguridad')}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>
<div class="workspace">
    <div th:replace="~{fragments/layout :: topbar}"></div>
    <main class="content">
        <div th:replace="~{fragments/layout :: alertas}"></div>
        <div class="page-head"><div><h1>Usuarios y seguridad</h1>
            <p>Credenciales BCrypt. Los perfiles se enlazan con profesores y estudiantes del modelo original.</p></div></div>
        <div class="grid-2">
            <form class="card stack" th:action="@{/usuarios}" th:object="${form}" method="post">
                <h2>Nuevo usuario</h2>
                <div class="field"><label for="username">Usuario</label><input id="username" type="text" th:field="*{username}" required/>
                    <small class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></small></div>
                <div class="field"><label for="password">Contraseña</label><input id="password" type="password" th:field="*{password}" required/></div>
                <div class="form-grid">
                    <div class="field"><label for="idProfesor">Código profesor</label><input id="idProfesor" type="number" th:field="*{idProfesor}"/></div>
                    <div class="field"><label for="idEstudiante">Código estudiante</label><input id="idEstudiante" type="number" th:field="*{idEstudiante}"/></div>
                </div>
                <div class="field"><label>Roles</label>
                    <label class="check" th:each="r : ${roles}">
                        <input type="checkbox" name="roles" th:value="${r['cod_rol']}"/>
                        <span th:text="${r['nombre']}">Rol</span>
                    </label>
                </div>
                <label class="check"><input type="checkbox" name="activo" value="true" checked/> Usuario activo</label>
                <button type="submit" class="button button-primary">Crear usuario</button>
            </form>
            <form class="card stack" th:action="@{/usuarios/cambiar-clave}" method="post">
                <h2>Cambiar mi contraseña</h2>
                <div class="field"><label for="actual">Contraseña actual</label><input id="actual" name="actual" type="password" required/></div>
                <div class="form-grid">
                    <div class="field"><label for="nueva">Nueva</label><input id="nueva" name="nueva" type="password" required/></div>
                    <div class="field"><label for="confirmacion">Confirmación</label><input id="confirmacion" name="confirmacion" type="password" required/></div>
                </div>
                <button type="submit" class="button button-primary">Actualizar contraseña</button>
            </form>
        </div>
        <section class="card table-card">
            <div class="card-head"><h2>Usuarios registrados</h2><span class="badge" th:text="${#lists.size(usuarios)} + ' usuario(s)'">0</span></div>
            <div class="table-responsive"><table class="table">
                <thead><tr><th>Usuario</th><th>Nombre</th><th>Roles</th><th>Perfil</th><th>Estado</th><th>Edición</th></tr></thead>
                <tbody>
                <tr th:each="u : ${usuarios}">
                    <td><strong th:text="${u['username']}">usuario</strong></td>
                    <td th:text="${u['nombre']} ?: '—'">Nombre</td>
                    <td th:text="${u['roles']}">Roles</td>
                    <td>
                        <span th:if="${u['id_profesor'] != null}" th:text="'Profesor ' + ${u['id_profesor']}">Profesor</span>
                        <span th:if="${u['id_estudiante'] != null}" th:text="'Estudiante ' + ${u['id_estudiante']}">Estudiante</span>
                        <span th:if="${u['id_profesor'] == null and u['id_estudiante'] == null}">Sin perfil académico</span>
                    </td>
                    <td><span class="badge" th:classappend="${u['activo']} ? 'badge-green' : 'badge-amber'"
                              th:text="${u['activo']} ? 'ACTIVO' : 'INACTIVO'">Estado</span></td>
                    <td>
                        <details>
                            <summary class="button button-sm button-ghost">Editar</summary>
                            <form class="stack mini-form" th:action="@{/usuarios/{u}/editar(u=${u['username']})}" method="post">
                                <input type="hidden" name="username" th:value="${u['username']}"/>
                                <input type="password" name="password" placeholder="Nueva clave (opcional)"/>
                                <input type="number" name="idProfesor" placeholder="Cód. profesor" th:value="${u['id_profesor']}"/>
                                <input type="number" name="idEstudiante" placeholder="Cód. estudiante" th:value="${u['id_estudiante']}"/>
                                <label class="check" th:each="r : ${roles}">
                                    <input type="checkbox" name="roles" th:value="${r['cod_rol']}"
                                           th:checked="${#strings.contains(u['roles'], r['cod_rol'])}"/>
                                    <span th:text="${r['cod_rol']}">Rol</span>
                                </label>
                                <label class="check"><input type="checkbox" name="activo" value="true" th:checked="${u['activo']}"/> Activo</label>
                                <button type="submit" class="button button-sm button-primary">Guardar</button>
                            </form>
                        </details>
                    </td>
                </tr>
                </tbody>
            </table></div>
        </section>
    </main>
    <div th:replace="~{fragments/layout :: footer}"></div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
