<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}"/>
    <meta name="_csrf_header" content="X-CSRF-TOKEN"/>
    <title th:text="${pageTitle} + ' | SIGI UEB'">SIGI UEB</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>

<aside class="sidebar" id="sidebar" th:fragment="sidebar">
    <div class="brand">
        <span class="brand-mark">UEB</span>
        <span class="brand-text">Investigación<small>Sistema de gestión</small></span>
    </div>
    <nav class="menu">
        <a th:each="item : ${menu}" th:href="${item.url}" class="menu-link" data-nav>
            <i class="bi" th:class="'bi ' + ${item.icono}"></i>
            <span th:text="${item.etiqueta}">Sección</span>
        </a>
    </nav>
    <div class="sidebar-foot">
        <span>SIGI · Datos reales</span>
        <span>MariaDB + Spring Boot</span>
    </div>
</aside>

<header class="topbar" th:fragment="topbar">
    <button type="button" class="icon-button menu-toggle" id="menuToggle" aria-label="Abrir menú">
        <i class="bi bi-list"></i>
    </button>
    <div class="topbar-title">
        <strong>Sistema de Gestión de Investigación</strong>
        <span>Universidad Estatal de Bolívar</span>
    </div>
    <div class="topbar-user">
        <span class="avatar" th:text="${#strings.substring(usuarioActual == null ? 'U' : usuarioActual, 0, 1)}">U</span>
        <div>
            <strong th:text="${usuarioActual}">usuario</strong>
            <small th:text="${rolesActuales}">roles</small>
        </div>
        <form th:action="@{/logout}" method="post" class="logout-form">
            <button type="submit" class="button button-ghost" title="Cerrar sesión">
                <i class="bi bi-box-arrow-right"></i><span>Salir</span>
            </button>
        </form>
    </div>
</header>

<div class="alertas" th:fragment="alertas">
    <div class="alert alert-ok" th:if="${exito}" th:text="${exito}">Éxito</div>
    <div class="alert alert-error" th:if="${error}" th:text="${error}">Error</div>
</div>

<footer class="footer" th:fragment="footer">
    <span>SIGI UEB · Proyecto académico</span>
    <span>2026</span>
</footer>

<th:block th:fragment="scripts">
    <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
